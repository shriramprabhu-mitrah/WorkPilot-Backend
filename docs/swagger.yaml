info:
  contact:
    email: olivergot26@gmail.com
    name: PMT Team
  description: PMT Backend API
  license:
    name: MIT
  termsOfService: http://swagger.io/terms/
  title: PMT API
  version: "1.0"
paths:
  /audit:
    get:
      consumes:
      - application/json
      description: Get paginated audit/activity logs for the authenticated user's
        organization.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Number of records per page
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get audit logs
      tags:
      - Audit
  /auth/{user_id}:
    get:
      consumes:
      - application/json
      description: Get user details by user ID within the authenticated user's organization
      parameters:
      - description: User ID (UUID)
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_ms-kanban-server_internal_handlers_dto_response.UserProfile'
              type: object
        "400":
          description: Invalid user ID
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.ErrorResponse'
      summary: Get User by ID
      tags:
      - Users
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Changes the password of the authenticated user.
      parameters:
      - description: Change Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ms-kanban-server_internal_handlers_dto_request.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.ErrorResponse'
      summary: Change password
      tags:
      - Authentication
  /auth/logout:
    post:
      description: Revokes the user's refresh token and let user logout.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.ErrorResponse'
      summary: Logout user
      tags:
      - Authentication
  /auth/me:
    get:
      description: Returns the profile of the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_ms-kanban-server_internal_handlers_dto_response.UserProfile'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.ErrorResponse'
      summary: Get current user
      tags:
      - Users
  /auth/password-reset/confirm:
    post:
      consumes:
      - application/json
      description: Validates the reset OTP and updates the user's password.
      parameters:
      - description: Password reset confirmation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ms-kanban-server_internal_handlers_dto_request.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.ErrorResponse'
      summary: Confirm password reset
      tags:
      - Authentication
  /auth/password-reset/request:
    post:
      consumes:
      - application/json
      description: Sends a password reset OTP to the provided email address.
      parameters:
      - description: Password reset request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ms-kanban-server_internal_handlers_dto_request.PasswordResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.ErrorResponse'
      summary: Request password reset
      tags:
      - Authentication
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Generates a new access token using the refresh token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_ms-kanban-server_internal_handlers_dto_request.AuthTokensResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_ms-kanban-server_internal_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
