basePath: /api/v1
definitions:
  dto.AcceptInvitationRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  dto.AuthTokensResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  dto.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
      user_id:
        type: string
    required:
    - new_password
    - old_password
    type: object
  dto.CreateOrganizationRequest:
    properties:
      country_id:
        type: string
      domain:
        type: string
      industry:
        allOf:
        - $ref: '#/definitions/dto.Industry'
        enum:
        - Information_Technology
        - Finance
        - Healthcare
        - Education
        - Manufacturing
        - Retail
        - Real Estate
        - Logistics
        - Hospitality
        - Other
      logo_url:
        type: string
      name:
        type: string
      slug:
        type: string
      team_size:
        allOf:
        - $ref: '#/definitions/dto.TeamSize'
        enum:
        - 1-10
        - 11-50
        - 51-200
        - 201-500
        - 501-1000
        - 1000+
    required:
    - country_id
    - domain
    - industry
    - name
    - team_size
    type: object
  dto.CreateProjectMemberRequest:
    properties:
      addedByID:
        type: string
      organizationID:
        type: string
      project_id:
        type: string
      user_id:
        items:
          type: string
        type: array
    required:
    - project_id
    - user_id
    type: object
  dto.CreateProjectRequest:
    properties:
      description:
        type: string
      name:
        maxLength: 150
        minLength: 3
        type: string
      organizationID:
        type: string
      userID:
        type: string
    required:
    - name
    type: object
  dto.CreateSprint:
    properties:
      end_date:
        type: string
      goal:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      start_date:
        type: string
    required:
    - end_date
    - name
    - start_date
    type: object
  dto.CreateSprintRequest:
    properties:
      organizationID:
        type: string
      projectID:
        type: string
      sprints:
        items:
          $ref: '#/definitions/dto.CreateSprint'
        type: array
      userID:
        type: string
    type: object
  dto.Industry:
    enum:
    - Information_Technology
    - Finance
    - Healthcare
    - Education
    - Manufacturing
    - Retail
    - Real Estate
    - Logistics
    - Hospitality
    - Other
    type: string
    x-enum-varnames:
    - IndustryInformationTechnology
    - IndustryFinance
    - IndustryHealthcare
    - IndustryEducation
    - IndustryManufacturing
    - IndustryRetail
    - IndustryRealEstate
    - IndustryLogistics
    - IndustryHospitality
    - IndustryOther
  dto.PasswordResetRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.ProjectMemberResponse:
    properties:
      full_name:
        type: string
      role:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  dto.ProjectResponse:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      creator:
        type: string
      description:
        type: string
      id:
        type: string
      members:
        items:
          $ref: '#/definitions/dto.ProjectMemberResponse'
        type: array
      name:
        type: string
      organization_id:
        type: string
      sprints:
        items:
          $ref: '#/definitions/dto.SprintResponse'
        type: array
      status:
        type: string
    type: object
  dto.ProjectStatus:
    enum:
    - planning
    - active
    - on_hold
    - completed
    - cancelled
    - archived
    type: string
    x-enum-varnames:
    - ProjectStatusPlanning
    - ProjectStatusActive
    - ProjectStatusOnHold
    - ProjectStatusCompleted
    - ProjectStatusCancelled
    - ProjectStatusArchived
  dto.RemoveUserRequest:
    properties:
      user_id:
        type: string
    type: object
  dto.ResendVerificationOTPRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.ResetPasswordRequest:
    properties:
      email:
        type: string
      new_password:
        type: string
      otp:
        type: string
    required:
    - email
    - new_password
    - otp
    type: object
  dto.Role:
    enum:
    - super_admin
    - org_admin
    - project_manager
    - developer
    - viewer
    type: string
    x-enum-varnames:
    - RoleSuperAdmin
    - RoleOrgAdmin
    - RoleProjectManager
    - RoleDeveloper
    - RoleViewer
  dto.SignInRequest:
    properties:
      email:
        type: string
      organization_id:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.SignUpRequest:
    properties:
      avatar_url:
        type: string
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
      timezone:
        type: string
      username:
        type: string
    required:
    - email
    - full_name
    - password
    - username
    type: object
  dto.SprintResponse:
    properties:
      end_date:
        type: string
      goal:
        type: string
      id:
        type: string
      name:
        type: string
      start_date:
        type: string
      status:
        type: string
    type: object
  dto.SprintStatus:
    enum:
    - planning
    - active
    - on_hold
    - completed
    - cancelled
    - archived
    type: string
    x-enum-varnames:
    - SprintStatusPlanning
    - SprintStatusActive
    - SprintStatusOnHold
    - SprintStatusCompleted
    - SprintStatusCancelled
    - SprintStatusArchived
  dto.TeamSize:
    enum:
    - 1-10
    - 11-50
    - 51-200
    - 201-500
    - 501-1000
    - 1000+
    type: string
    x-enum-varnames:
    - TeamSize1To10
    - TeamSize11To50
    - TeamSize51To200
    - TeamSize201To500
    - TeamSize501To1000
    - TeamSize1000Plus
  dto.UpdateOrganizationRequest:
    properties:
      country_id:
        type: string
      domain:
        type: string
      logo_url:
        type: string
      name:
        type: string
      team_size:
        allOf:
        - $ref: '#/definitions/dto.TeamSize'
        enum:
        - 1-10
        - 11-50
        - 51-200
        - 201-500
        - 501-1000
        - 1000+
    required:
    - team_size
    type: object
  dto.UpdateProjectRequest:
    properties:
      description:
        type: string
      name:
        maxLength: 150
        minLength: 3
        type: string
      organizationID:
        type: string
      projectID:
        type: string
      status:
        $ref: '#/definitions/dto.ProjectStatus'
      userID:
        type: string
    type: object
  dto.UpdateSprintRequest:
    properties:
      end_date:
        type: string
      goal:
        maxLength: 500
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      organizationID:
        type: string
      projectID:
        type: string
      sprintID:
        type: string
      start_date:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/dto.SprintStatus'
        enum:
        - planning
        - active
        - on_hold
        - completed
        - cancelled
        - archived
      userID:
        type: string
    type: object
  dto.UpdateUserRequest:
    properties:
      avatar_url:
        type: string
      full_name:
        type: string
      timezone:
        type: string
      username:
        type: string
    type: object
  dto.UserRoleRequest:
    properties:
      role:
        $ref: '#/definitions/dto.Role'
      user_id:
        type: string
    type: object
  dto.UserStatusRequest:
    properties:
      is_active:
        type: boolean
      user_id:
        type: string
    type: object
  dto.VerifyEmailRequest:
    properties:
      email:
        type: string
      otp:
        type: string
    required:
    - email
    - otp
    type: object
  models.Organization:
    properties:
      country:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      domain:
        type: string
      id:
        type: string
      industry:
        type: string
      is_active:
        type: boolean
      logo_url:
        type: string
      name:
        type: string
      slug:
        type: string
      team_size:
        type: string
      updated_at:
        type: string
    required:
    - country
    - domain
    - industry
    - logo_url
    - team_size
    type: object
  models.User:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      is_verified:
        type: boolean
      joined_at:
        type: string
      name:
        type: string
      organization:
        $ref: '#/definitions/models.Organization'
      organization_id:
        type: string
      role:
        type: string
      timezone:
        type: string
      updated_at:
        type: string
      username:
        type: string
    required:
    - email
    type: object
  response.Error:
    properties:
      code:
        $ref: '#/definitions/response.ErrorCode'
      message:
        type: string
      status_code:
        type: integer
    type: object
  response.ErrorCode:
    enum:
    - BAD_REQUEST
    - METHOD_NOT_ALLOWED
    - VALIDATION_ERROR
    - UNAUTHORIZED
    - FORBIDDEN
    - RESOURCE_NOT_FOUND
    - CONFLICT
    - GONE
    - BUSINESS_RULE_VIOLATION
    - RATE_LIMIT_EXCEEDED
    - INTERNAL_SERVER_ERROR
    - SERVICE_UNAVAILABLE
    - GATEWAY_TIMEOUT
    type: string
    x-enum-varnames:
    - ErrBadRequest
    - ErrMethodNotAllowed
    - ErrValidation
    - ErrUnauthorized
    - ErrForbidden
    - ErrNotFound
    - ErrConflict
    - ErrGone
    - ErrBusinessRule
    - ErrRateLimitExceeded
    - ErrInternalServerError
    - ErrServiceUnavailable
    - ErrGatewayTimeout
  response.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/response.Error'
      success:
        type: boolean
    type: object
  response.Pagination:
    properties:
      has_next:
        type: boolean
      has_previous:
        type: boolean
      page:
        type: integer
      page_size:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  response.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/response.Pagination'
      status_code:
        type: integer
      success:
        type: boolean
    type: object
host: localhost:6369
info:
  contact:
    email: olivergot26@gmail.com
    name: PMT Team
  description: PMT Backend API
  license:
    name: MIT
  termsOfService: http://swagger.io/terms/
  title: PMT API
  version: "1.0"
paths:
  /api/v1/project/{project_id}/detail:
    get:
      consumes:
      - application/json
      description: Retrieve a project's details along with its members and sprints.
      parameters:
      - description: Project ID (UUID)
        in: path
        name: project_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Project retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProjectResponse'
              type: object
        "400":
          description: Invalid project ID
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Project not found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get project details
      tags:
      - Projects
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Changes the password of the authenticated user.
      parameters:
      - description: Change Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Change password
      tags:
      - Authentication
  /auth/logout:
    post:
      description: Revokes the user's refresh token and let user logout.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Logout user
      tags:
      - Authentication
  /auth/me:
    get:
      description: Returns the profile of the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get current user
      tags:
      - Users
  /auth/password-reset/confirm:
    post:
      consumes:
      - application/json
      description: Validates the reset OTP and updates the user's password.
      parameters:
      - description: Password reset confirmation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Confirm password reset
      tags:
      - Authentication
  /auth/password-reset/request:
    post:
      consumes:
      - application/json
      description: Sends a password reset OTP to the provided email address.
      parameters:
      - description: Password reset request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.PasswordResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Request password reset
      tags:
      - Authentication
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Generates a new access token using the refresh token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthTokensResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Refresh access token
      tags:
      - Authentication
  /auth/resend-verification-otp:
    post:
      consumes:
      - application/json
      description: Sends a new email verification OTP to an unverified user.
      parameters:
      - description: Resend verification OTP request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResendVerificationOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Resend verification OTP
      tags:
      - Authentication
  /auth/signin:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns access and refresh tokens.
      parameters:
      - description: Sign In Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthTokensResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Sign in user
      tags:
      - Authentication
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Creates a new user account.
      parameters:
      - description: Sign Up Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SignUpRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Register a new user
      tags:
      - Authentication
  /auth/update:
    patch:
      consumes:
      - application/json
      description: Updates user profile.
      parameters:
      - description: Update User Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Update user
      tags:
      - Users
  /auth/validate:
    get:
      description: Returns whether the provided email or username is not already registered.
      parameters:
      - description: 'Validation type: email or username'
        in: query
        name: type
        required: true
        type: string
      - description: Value to validate
        in: query
        name: value
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Check whether an email or username is available
      tags:
      - Authentication
  /auth/verify-email:
    post:
      consumes:
      - application/json
      description: Validates the verification OTP and marks the email as verified.
      parameters:
      - description: Email verification request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Verify email address
      tags:
      - Authentication
  /countries:
    get:
      description: Returns a list of countries (code + name)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get all countries
      tags:
      - Lookup
  /organization/create:
    post:
      consumes:
      - application/json
      description: Creates a new Organization account.
      parameters:
      - description: Creates new Organization
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateOrganizationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Register a new Organization
      tags:
      - Organizations
  /organization/delete:
    delete:
      description: Returns the profile of the authenticated Organization.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Organization'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: delete current Organization
      tags:
      - Organizations
  /organization/get:
    get:
      description: Returns the profile of the authenticated Organization.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Organization'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
